<body class="s-lib-public-body">
    {{skip_link}}
    <!-- BEGIN: Page Header -->
    {{public_header}}
    <!-- END: Page Header -->
    <!-- BEGIN: Content Header -->
    <div id="s-lib-public-header" class="s-lib-header container s-lib-side-borders">
        <div id="s-lib-bc">{{breadcrumbs}}
        </div>
        <h1 id="s-lib-public-header-title">{{page_title}}</h1>
        <div id="s-lib-public-header-desc">{{page_description}}</div>
    </div>
    <!-- END: Content Header -->
    <!-- BEGIN: Nav Bar -->
    <div id="s-lib-public-nav" class="container s-lib-side-borders">
        {{page_nav}}
    </div>
    <!-- END: Nav Bar -->
    <!-- BEGIN: content -->
    <div id="s-lib-public-main" class="s-lib-main container s-lib-side-borders">
        <section>
            <div id="s-lg-az-search-bar" class="row">
                <div id="az-search-col-1" class="col-md-12 center">
                    {{navbar}}
                </div>
            </div>
        </section>
        <section>
            <div id="s-lg-az-cols" class="row">
                <div id="col1" class="col-md-8 center">
                    <div id="s-lg-az-index" class="pad-right-sm">
                        {{alpha_list}}
                    </div>
                    <div id="s-lg-az-search-reset" class="pad-top-med pad-bottom-med">
                        {{search_reset}}
                    </div>
                    <div id="s-lg-az-content" class="pad-right-sm pad-top-med">
                        <div class="bold s-lib-color-lt-grey pad-top-med text-center">Loading...</div>
                    </div>
                </div>
                <style>
                    .s-lib-box {
                        border-color: #adcde5;
                        border-width: 1px;
                        box-shadow: 0 8px 6px -6px #AAAAAA;
                        border-radius: 0;
                        background-color: #ffffff;
                    }

                    .s-lib-box-std .s-lib-box-title {
                        background-color: #c1daeb;
                        background-image: none;
                        color: #555555;
                        border-bottom: 1px solid #adcde5;
                    }

                    .s-lib-box .s-lib-box-title {
                        background-color: #c1daeb;
                        background-image: none;
                        color: #555555;
                        border-bottom: 1px solid #adcde5;
                        ;
                        border-radius: 0;
                    }
                </style>
                <style>
                    #s-lg-az-trials-div {
                        border: solid 1px #adcde5;
                        box-shadow: 0 8px 6px -6px #AAAAAA;
                        border-radius: 0;
                        background-color: #ffffff;
                    }

                    #s-lg-az-trials-div .pad-top-sm {
                        padding: 0px 10px;
                    }

                    #s-lg-az-trials-div .s-lg-az-result-badge-new {
                        display: none;
                    }

                    .s-lib-public-side-header {
                        background-color: #c1daeb;
                        font-weight: 400;
                        font-size: 17px;
                        color: #555555;
                        padding: 6px 8px;
                        border: 0px;
                        line-height: 20px;
                    }
                </style>
                <div id="col2" class="col-md-4 center">
                    {{content_box_3596636}}
                    {{content_box_4519018}}
                    {{content_box_3577872}}
                    <div class="s-lg-db-panel">{{trials_box}}</div>
                </div>
            </div>
        </section>
    </div>
    <!-- END: content -->
    <!-- BEGIN: Custom Footer -->
    {{public_footer}}
    <!-- END: Custom Footer -->
    <!-- BEGIN: Page Footer -->
    {{system_footer}}
    <!-- END: Page Footer -->
    <div id="s-lib-alert" title="">
        <div id="s-lib-alert-content"></div>
    </div>
    <div id="s-lib-popover-title" class="hide">
        <span class="text-info"><strong>title</strong></span>
        <button type="button" id="popclose" class="close"
            onclick="jQuery('.s-lib-popover').popover('hide')">&times;</button>
    </div>
    <div id="s-lib-popover-content" class="hide"><i class="fa fa-refresh fa-spin"></i> Loading...
        <button class="btn btn-default btn-sm popclose" type="button">Close</button>
    </div>
    <div id="s-lib-scroll-top" title="Back to Top">
        <span class="fa-stack fa-lg">
            <i class="fa fa-square-o fa-stack-2x"></i>
            <i class="fa fa-angle-double-up fa-stack-1x" style="position:relative; bottom:2px;"></i>
        </span>
    </div>
</body>
