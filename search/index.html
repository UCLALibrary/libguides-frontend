<script>
    var sort_vals = {};
    var start_vals = {};
    var pre_load_facets = {
        guide_tag_ids: 0
    };

    clearPreLoadFacets = function () {
        pre_load_facets = {};
    }

    preSelectFacet = function () {
        // Loop over preset facets and check the corresponding box.
        jQuery.each(pre_load_facets, function (idx, val) {
            if (pre_load_facets[idx]) {
                jQuery('input:checkbox[name="' + idx + '"][value="' + val + '"]').prop('checked', true);
            }
        });

        // Clear pre load facets so they are only used on first page load.
        clearPreLoadFacets();
    }

    getCloudSearchData = function (action, search_source_id) {
        var data = {
            q: jQuery("#s-lg-srch-input-q").val(),
            action: action,
            search_source_id: search_source_id,
            layout: "bento"
        };

        // if set, grab the sort for this search source
        if (typeof sort_vals[search_source_id] != "undefined") {
            data.sort = sort_vals[search_source_id];
        }

        // if set, grab the start for this search source
        data.start = (typeof start_vals[search_source_id] != "undefined"
                ? data.start = start_vals[search_source_id]
                : 0
        );

        switch (action) {
            case 580:
            case 581:
                data.group_id = jQuery("#group_id").val();
                data.guide_id = jQuery("#guide_id").val();

                data.f_group_id = jQuery("[name=group_id]:checked").map(function () {
                    return this.value;
                }).get().join(",");

                if (data.group_id != 0) {
                    data.f_group_id = data.group_id;
                }

                data.f_guide_type_id = jQuery("[name=guide_type_id]:checked").map(function () {
                    return this.value;
                }).get().join(",");

                data.f_guide_owner_id = jQuery("[name=guide_owner_id]:checked").map(function () {
                    return this.value;
                }).get().join(",");

                data.f_guide_tag_ids = pre_load_facets["guide_tag_ids"] || jQuery("[name=guide_tag_ids]:checked").map(function () {
                    return this.value;
                }).get().join(",");

                data.f_guide_subject_ids = jQuery("[name=guide_subject_ids]:checked").map(function () {
                    return this.value;
                }).get().join(",");

                // if the sort is not set use a default, which is the score
                if (typeof data.sort === "undefined") {
                    data.sort = "_score";
                }
                break;

            case 582:
                // nothing to add for this case
                data.group_id = jQuery("#group_id").val();
                break;

            case 583:
                data.group_id = jQuery("#group_id").val();

                data.f_type_ids = jQuery("[name=type_ids]:checked").map(function () {
                    return this.value;
                }).get().join(",");

                data.f_vendor_id = jQuery("[name=vendor_id]:checked").map(function () {
                    return this.value;
                }).get().join(",");

                data.f_subject_ids = jQuery("[name=subject_ids]:checked").map(function () {
                    return this.value;
                }).get().join(",");

                // if the sort is not set use a default, which is the name
                if (typeof data.sort === "undefined") {
                    data.sort = "name";
                }
                break;

            case 584:
            case 585:
                data.f_author_ids = jQuery("[name=author_id]:checked").map(function () {
                    return this.value;
                }).get().join(",");

                data.f_subject_ids = jQuery("[name=subject_ids]:checked").map(function () {
                    return this.value;
                }).get().join(",");

                data.f_tag_ids = jQuery("[name=tag_ids]:checked").map(function () {
                    return this.value;
                }).get().join(",");

                // if the sort is not set use a default, which is the name
                if (typeof data.sort === "undefined") {
                    data.sort = "title";
                }
                break;
        }

        return data;
    }

    searchLg2Local = function (search_source_id) {
        // when processing a new search, we want to reset our start value
        start_vals[search_source_id] = 0;

        // hide the elements we dont want to display
        hideUnwantedElements(search_source_id);

        // clear our facet div; this prevents the user from seeing the default facet structure returned from the common search code
        jQuery("#s-srch-source-" + search_source_id + " .col-right").html("");

        springSpace.UI.notify({mode: "load", duration: 30000});
        jQuery.ajax({
            url: "/srch_process_cs.php",
            type: "GET",
            dataType: "json",
            data: getCloudSearchData(580, search_source_id),
            success: function (response, textStatus, jqXHR) {
                springSpace.UI.notifyStop();
                if (response.errCode != 200) {
                    searchLg2LocalErr(search_source_id);
                    return;
                }

                // populate the search results; set width based on the facet display
                jQuery("#s-srch-results-" + search_source_id).html(response.data.results);
                jQuery("#s-srch-source-" + search_source_id + " .col-left").addClass(response.data.facets == "" ? "col-md-12" : "col-md-9").removeClass(response.data.facets == "" ? "col-md-9" : "col-md-12");

                // populate the facet results; hide the panel if the facets are empty
                jQuery("#s-srch-source-" + search_source_id + " .col-right").html(response.data.facets);
                jQuery("#s-srch-source-" + search_source_id + " .col-right").toggle(response.data.facets != "");

                // Check pre-load facets.
                preSelectFacet();

                // set the page title
                jQuery("#s-lib-public-header-title").html(response.data.title);
                setPageTitle(response.data.title);

                // set the full-link for bento display
                jQuery("#s-srch-source-" + search_source_id + " div.s-srch-fulllink a").attr("href", response.data.fulllink);
                jQuery("#s-srch-source-" + search_source_id + " div.s-srch-fulllink a").attr("aria-label", "See more" + (response.data.q ? " " + response.data.q : "") + " results");
            },
            error: function (jqXHR, textStatus, errorThrown) {
                searchLg2LocalErr(search_source_id);
                springSpace.UI.notifyStop();
            }
        });
    }

    searchLg2LocalErr = function (search_source_id) {
        jQuery("#s-srch-control-header").html("");
        jQuery("#s-srch-results-" + search_source_id).html("");
    }

    searchBlogLocal = function (search_source_id) {
        // when processing a new search, we want to reset our start value
        start_vals[search_source_id] = 0;

        // hide the elements we dont want to display
        hideUnwantedElements(search_source_id);

        jQuery("#s-srch-source-" + search_source_id + " .col-right").html("");

                springSpace.UI.notifyStop();
                if (response.errCode == 200) {
                    // populate the search results; set width based on the facet display

                    // populate the facet results; hide the panel if the facets are empty
                    jQuery("#s-srch-source-" + search_source_id + " .col-right").html(response.data.facets).toggle(response.data.facets != "");

                    // Check pre-load facets.
                    preSelectFacet();

                    // set the page title
                    jQuery("#s-lib-public-header-title").html(response.data.title);
                    setPageTitle(response.data.title);

                    // set the full-link for bento display
                    jQuery("#s-srch-source-" + search_source_id + " div.s-srch-fulllink a").attr("href", response.data.fulllink);
                    jQuery("#s-srch-source-" + search_source_id + " div.s-srch-fulllink a").attr("aria-label", "See more" + (response.data.q ? " " + response.data.q : "") + " results");
                } else {
                    springSpace.UI.error(response.errCode);
                }
            },
            error: function (jqXHR, textStatus, errorThrown) {
                springSpace.UI.notifyStop();
                springSpace.UI.error(errorThrown);
            }
        });
    }

    searchLg2Az = function (search_source_id) {
        // when processing a new search, we want to reset our start value
        start_vals[search_source_id] = 0;

        // hide the elements we dont want to display
        hideUnwantedElements(search_source_id);

        springSpace.UI.notify({mode: "load", duration: 30000});
        jQuery.ajax({
                url: "/srch_process_cs.php",
                type: "GET",
                dataType: "json",
                data: getCloudSearchData(582, search_source_id),
                success: function (response, textStatus, jqXHR) {
                    springSpace.UI.notifyStop();
                    if (response.errCode == 200) {
                        // populate the search results; set width based on the facet display
                        jQuery("#s-srch-results-" + search_source_id).html(response.data.results);
                        jQuery("#s-srch-source-" + search_source_id + " .col-left").addClass(response.data.facets == "" ? "col-md-12" : "col-md-9").removeClass(response.data.facets == "" ? "col-md-9" : "col-md-12");

                        // populate the facet results; hide the panel if the facets are empty
                        jQuery("#s-srch-source-" + search_source_id + " .col-right").html(response.data.facets);
                        jQuery("#s-srch-source-" + search_source_id + " .col-right").toggle(response.data.facets != "");

                        // set the page title
                        jQuery("#s-lib-public-header-title").html(response.data.title);
                        setPageTitle(response.data.title);

                        // set the full-link for bento display
                        jQuery("#s-srch-source-" + search_source_id + " div.s-srch-fulllink a").attr("href", response.data.fulllink);
                        jQuery("#s-srch-source-" + search_source_id + " div.s-srch-fulllink a").attr("aria-label", "See more" + (response.data.q ? " " + response.data.q : "") + " results");
                    } else {
                        springSpace.UI.error(response.errCode);
                    }
                },
                error: function (jqXHR, textStatus, errorThrown) {
                    springSpace.UI.notifyStop();
                    springSpace.UI.error(errorThrown);
                }
            }
        );
    }

    processChange = function (data) {
        springSpace.UI.notify({mode: "load", duration: 30000});
        jQuery.ajax({
            url: "/srch_process_cs.php",
            type: "GET",
            dataType: "json",
            data: data,
            success: function (response, textStatus, jqXHR) {
                springSpace.UI.notifyStop();
                if (response.errCode == 200) {
                    data.search_source_id = data.search_source_id || 0;
                    const search_status = '<div id="s-lg-search-status" class="sr-only" aria-live="polite" aria-atomic="true"></div>';
                    jQuery("#s-srch-results-" + data.search_source_id).html(search_status + response.data.results);
                    jQuery("#s-lib-public-header-title").html(response.data.title);
                    jQuery('#s-lg-search-status').text('Search results updated based on selected filters.');
                    setPageTitle(response.data.title);
                } else {
                    springSpace.UI.error(response.errCode);
                }
            },
            error: function (jqXHR, textStatus, errorThrown) {
                springSpace.UI.notifyStop();
                springSpace.UI.error(errorThrown);
            }
        });
    }

    changeSort = function (sort, action, search_source_id) {
        // when processing a sort change, we want to reset our start value
        start_vals[search_source_id] = 0;

        // set the sort variable for this search source
        sort_vals[search_source_id] = sort;

        // call processChange, passing in the current search data
        processChange(getCloudSearchData(action, search_source_id));
    }

    changeStart = function (start, action, search_source_id) {
        // set the start variable for this search source
        start_vals[search_source_id] = start;

        // call processChange, passing in the current search data
        processChange(getCloudSearchData(action, search_source_id));
    }

    expandSearch = function (search_source_id, group_id) {
        document.location.href = "?" + (group_id != 0 ? "group_id=" + group_id + "&" : "") + "q=" + jQuery("#s-lg-srch-input-q").val() + "&t=" + search_source_id;
    }

    changeFacet = function (action, search_source_id) {
        // when processing a facet change, we want to reset our start value
        start_vals[search_source_id] = 0;

        // call processChange, passing in the current search data
        processChange(getCloudSearchData(action, search_source_id));
    }

    clearFacets = function (facet_id, action, search_source_id) {
        jQuery("#s-lg-facet-div-" + facet_id).find("input[type=checkbox]:checked").removeAttr("checked");
        changeFacet(action, search_source_id);
    }

    hideUnwantedElements = function (search_source_id) {
        jQuery("#s-srch-header-" + search_source_id).toggle(false);					// result summary
        jQuery("#s-srch-paginate-" + search_source_id + "-top").toggle(false);		// paging top
        jQuery("#s-srch-params-" + search_source_id).toggle(false);					// search params
        jQuery("#s-srch-paginate-" + search_source_id + "-bottom").toggle(false);	// paging bottom
    }

    var originalTitle = jQuery("title").text();
    setPageTitle = function (title) {
        if (jQuery("title").text() == '') {
            if (originalTitle !== '') {
                jQuery("title").text(originalTitle);
            } else {
                jQuery("title").text(title != '' ? title + ' - LibGuides' : 'Search - LibGuides');
