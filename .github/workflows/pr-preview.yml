name: LibGuides PR Preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build PR #${{ github.event.pull_request.number }}
    runs-on: ubuntu-latest

    if: github.event.pull_request.head.repo.full_name == github.repository

    concurrency:
      group: pr-build-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static PR preview
        env:
          PREVIEW_BASE_PATH: /libguides-frontend/pr-${{ github.event.pull_request.number }}/
          SEARCH_PROXY_URL: https://libguides-proxy.netlify.app/api/libguides/search/proxy
          DATABASE_PROXY_URL: https://libguides-proxy.netlify.app/api/libguides/az/databases/proxy
        run: npm run build:preview

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview
          path: dist/
          retention-days: 3

  deploy:
    name: Publish PR #${{ github.event.pull_request.number }}
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      deployments: write

    environment:
      name: pr-${{ github.event.pull_request.number }}
      url: https://uclalibrary.github.io/libguides-frontend/pr-${{ github.event.pull_request.number }}/

    concurrency:
      group: libguides-pages-publish
      cancel-in-progress: false

    steps:
      - name: Download preview artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-preview
          path: dist/

      - name: Deploy PR preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Add preview URL to summary
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "## PR #${PR_NUMBER} Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open preview](https://uclalibrary.github.io/libguides-frontend/pr-${PR_NUMBER}/)" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR preview URL
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;
            const marker = '<!-- libguides-pr-preview -->';

            const previewUrl =
              `https://uclalibrary.github.io/libguides-frontend/pr-${prNumber}/`;

            const body = [
              marker,
              '## LibGuides PR Preview',
              '',
              `**Preview:** ${previewUrl}`,
              '',
              `**Search:** ${previewUrl}search/`,
              '',
              'Updated automatically after each successful deployment.'
            ].join('\n');

            // Find an existing preview comment from this workflow.
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100
              }
            );

            const existingComment = comments.find(
              comment =>
                comment.user?.type === 'Bot' &&
                comment.body?.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              });
            }
