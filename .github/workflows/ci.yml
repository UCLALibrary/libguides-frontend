name: LibGuides CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  cypress:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check server syntax
        run: node --check dev/server.mjs

      - name: Run Cypress tests
        uses: cypress-io/github-action@v7.4.6
        with:
          start: npm run dev
          wait-on: 'http://127.0.0.1:3000'
          browser: chrome

      # Remove any snapshots from the functional test run.
      - name: Clean Chromatic archives
        if: success()
        run: rm -rf cypress/downloads/chromatic-archives

      # Run Cypress again to collect selected visual snapshots.
      - name: Collect Chromatic snapshots
        if: success()
        run: npx cypress run --browser chrome
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          CYPRESS_VISUAL_PROVIDER: chromatic

      - name: Publish Chromatic snapshots (PR)
        if: github.event_name == 'pull_request'
        run: >
          npx chromatic --cypress
          --project-token="$CHROMATIC_PROJECT_TOKEN"
          --exit-zero-on-changes=true
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

      - name: Publish Chromatic snapshots (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >
          npx chromatic --cypress
          --project-token="$CHROMATIC_PROJECT_TOKEN"
          --auto-accept-changes
          --exit-zero-on-changes=true
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
