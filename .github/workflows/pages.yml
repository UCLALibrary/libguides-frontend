name: Deploy LibGuides Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build main preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static pages
        env:
          PREVIEW_BASE_PATH: /libguides-frontend/
          SEARCH_PROXY_URL: https://libguides-proxy.netlify.app/api/libguides/search/proxy
          DATABASE_PROXY_URL: https://libguides-proxy.netlify.app/api/libguides/az/databases/proxy
        run: npm run build:preview

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-preview
          path: dist/
          retention-days: 3

  deploy:
    name: Publish main preview
    needs: build
    runs-on: ubuntu-latest

    concurrency:
      group: libguides-pages-publish
      cancel-in-progress: false

    steps:
      - name: Download preview artifact
        uses: actions/download-artifact@v4
        with:
          name: main-preview
          path: dist/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: true
